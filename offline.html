<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Offline - IPTV Hero Pro TV</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; padding: 20px; }
        .box { max-width: 400px; }
        h1 { color: #38bdf8; margin-bottom: 12px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 20px; }
        button { padding: 10px 24px; border-radius: 6px; border: none; background: #38bdf8; color: #0f172a; font-weight: 700; font-size: 1rem; cursor: pointer; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📡 Sem conexão</h1>
        <p>Você está offline. Conecte-se à internet e tente novamente para carregar suas listas IPTV.</p>
        <button onclick="location.reload()">Tentar novamente</button>
    </div>
</body>
</html>
